<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Cody Ayers</title>
    <link href="img/cody-ayers-favicon-.png" rel="shortcut icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link href="css/normalize.css" rel="stylesheet" type="text/css" />
    <link href="css/style.production.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <header class="page-header">
      <img
        src="img/cody-ayers-logo.png"
        alt="Cody Ayers Logo"
        class="page-header__item"
        id="logo"
      />
      <nav class="main-navigation page-header__item">
        <ul role="menubar" class="navigation-list">
          <li role="presentation">
            <a href="index.html" role="menuitem" class="navigation-list__item"
              >Home</a
            >
          </li>
          <li role="presentation">
            <a href="about.html" role="menuitem" class="navigation-list__item"
              >About Me</a
            >
          </li>
          <li role="presentation">
            <a href="work.html" role="menuitem" class="navigation-list__item"
              >Work</a
            >
          </li>
          <li role="presentation">
            <a
              href="contact.html"
              role="menuitem"
              class="navigation-list__item navigation-list__item--active"
              >Contact</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main class="main-content">
      <section class="contact-container">
        <div class="contact-card">
          <h1>Get In Touch</h1>
          <p class="contact-subtitle">
            I’m currently open to web development opportunities. Feel free to
            reach out!
          </p>

          <div class="contact-details">
            <div class="contact-info-item">
              <strong>Location:</strong>
              <span>Colorado Springs, CO</span>
            </div>
            <div class="contact-info-item">
              <strong>Email:</strong>
              <a href="mailto:cayers21@gmail.com">cayers21@gmail.com</a>
            </div>
            <div class="contact-info-item">
              <strong>Phone:</strong>
              <a href="tel:7196481820">(719) 648-1820</a>
            </div>
          </div>

          <!-- Formspree Integration Form -->
          <form
            class="contact-form"
            action="https://formspree.io/f/mwlpeoyg"
            method="POST"
          >
            <!-- Formspree Configurations -->
            <input
              type="hidden"
              name="_subject"
              value="New Portfolio Contact Submission"
            />

            <!-- axe-disable-line label -->
            <input
              type="text"
              name="_gotcha"
              aria-label="Do not fill this out"
              style="display: none !important"
              tabindex="-1"
              autocomplete="off"
            />

            <div class="form-group">
              <label for="contact-name">Name</label>
              <input
                type="text"
                id="contact-name"
                name="name"
                placeholder="Your Name"
                required
              />
            </div>

            <div class="form-group">
              <label for="contact-email">Email</label>
              <input
                type="email"
                id="contact-email"
                name="email"
                placeholder="your.email@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="contact-message">Message</label>
              <textarea
                id="contact-message"
                name="message"
                rows="5"
                placeholder="How can I help you?"
                required
              ></textarea>
            </div>

            <button type="submit" class="button">Send Message</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <p>Find me on:</p>
      <div class="social-media">
        <a href="https://github.com/Cody-Ayers" target="_blank"
          ><img src="img/github_icon.svg" alt="GitHub"
        /></a>
        <a href="https://linkedin.com" target="_blank"
          ><img src="img/linkedin_icon.svg" alt="LinkedIn"
        /></a>
      </div>
    </footer>
  </body>
</html>
